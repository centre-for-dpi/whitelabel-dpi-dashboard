# yaml-language-server: $schema=../schema/layout.schema.json
#
# THE PAGE.
#
# Which sections exist, in what order, with which widgets bound to which data —
# all of it is here. Rearranging the dashboard, dropping a section, adding a
# metric column or reordering the drawer tabs is an edit to this file. No Go, no
# templates.
#
# The whole layout is validated at startup against the widget registry and
# against your own domain.yaml, and every problem is reported with the line that
# caused it. A mistyped widget type stops the binary rather than rendering as a
# blank panel nobody notices for a month.
#
# Two things are worth knowing before you edit:
#
#   Sections are the HTMX swap unit. `swap` names the fragment route that
#   re-renders just that band, which is why narrowing a filter replaces the
#   leaderboard and leaves the rest of the page — and the reader's scroll
#   position — alone.
#
#   Bind sources are a closed set, not an expression language. Run
#   `make validate` after an edit and any unknown source is listed along with
#   everything that is available.

pages:
  - id: home
    path: /
    sections:
      # -------------------------------------------------------------------
      # THE VERDICT
      #
      # One question, answered before anything else: is this working right
      # now? Status is deliberately NOT windowed — an average over ninety days
      # cannot answer "right now", and a verdict bar that tried would be
      # answering a question nobody asked.
      # -------------------------------------------------------------------
      - id: verdict
        swap: /fragments/verdict
        # The parts of this band are not interchangeable, so its tracks are
        # named rather than auto-fitted: the question spans the measure, the
        # figures want most of what is left, and the sentences explaining what
        # the words mean want a column beside them rather than a paragraph
        # wedged between a tally and the bar that restates it.
        grid:
          gap: 20px 48px
          columns:
            - { name: question, basis: "1 1 100%" }
            - { name: figures, basis: "1 1 540px" }
            - { name: meaning, basis: "1 1 260px" }
            # Full width, so it wraps onto its own line under both, and laid out
            # as a row so the button and the two lines beside it read as one
            # statement rather than a stack.
            - { name: actions, basis: "1 1 100%", direction: row }
            # The published rules, last: an answer to a question the reader only
            # has once they have seen the verdict.
            - { name: notes, basis: "1 1 100%" }
        widgets:
          - type: heading
            column: question
            options:
              termId: verdict.h1
              scoped: true # reads differently in the national and state views
              level: 1
              class: serif
              id: verdict-title

          - type: status-summary
            column: figures
            bind: { source: aggregate.statusCounts }
            options:
              allWellTermId: verdict.allClear

          # The sentences that say what the words mean. Any paragraph on the page
          # is a term id listed here, so changing the copy — or dropping it — is
          # an edit to this file and the locale files, not to Go.
          #
          # Each term may pick out words with <strong>, <em> or
          # <mark tone="…">, and nothing else. See internal/prose.
          - type: prose
            column: meaning
            options:
              termIds:
                - verdict.kicker1
                - verdict.kicker2
                - verdict.kicker3

          - type: segmented-bar
            column: figures
            bind: { source: aggregate.statusCounts }
            options:
              labelTermId: verdict.barLabel
              # Below this width the bar becomes a row of slivers; the legend
              # below says the same thing in text and does not.
              hideBelow: 480px

          - type: legend
            column: figures
            bind: { source: aggregate.statusCounts }

          # The button and the two lines qualifying it share a row rather than
          # stacking: they are one statement about the verdict above, and three
          # separate lines of grey read as three separate claims.
          - type: cta-button
            column: actions
            options:
              termId: verdict.findService
              target: "#leaderboard"
              iconKey: ui.arrow

          - type: timestamp
            column: actions
            bind: { source: aggregate.updatedAt }
            options:
              termId: verdict.updated
              # Data quietly going stale is the failure a status dashboard can
              # least afford, so say so after fifteen minutes.
              staleAfter: 900

          - type: coverage
            column: actions
            bind: { source: aggregate.coverage }
            options:
              termId: verdict.coverage

          # The published rules, with the live threshold numbers filled in from
          # domain.yaml — so the rule shown is provably the rule applied.
          - type: disclosure
            column: notes
            bind: { source: config.thresholdProse }
            options:
              summaryTermId: legend.title

      # -------------------------------------------------------------------
      # SIGNALS
      #
      # What changed and why. Each card prints the literal rule that produced
      # it: a dashboard that says "this needs attention" has to say why.
      # -------------------------------------------------------------------
      - id: signals
        swap: /fragments/signals
        # The band's own name is set as an eyebrow rather than a title: it is a
        # label for the cards below, not a second headline competing with the
        # question at the top of the page. It is still a real h2, so the outline
        # a screen reader builds has the section in it.
        heading:
          titleTermId: sig.eyebrow
          # The band names what it is showing, and it shows two different
          # things.
          variants:
            opportunity: opp.eyebrow
          level: 2
          class: eyebrow
        # Which set of findings is on view — beside the band's name rather than
        # under it, because it qualifies the heading rather than belonging to
        # the cards.
        aside:
          - type: signal-tabs
            options:
              labelTermId: sig.tabsLabel
              attentionTermId: sig.tab.attention
              opportunityTermId: sig.tab.opportunity
        grid: { minColWidth: 240px, gap: 14px }
        widgets:
          - type: signal-cards
            bind: { source: aggregate.signals }
            options:
              actionTermId: sig.viewAffected
              actionIconKey: ui.arrow

      # -------------------------------------------------------------------
      # THE LEADERBOARD
      #
      # Everything here follows the reader's selected period. Rank is computed
      # from performance across that window, and every figure beside it is read
      # over the same window — so the ordering and the numbers agree. Switching
      # to 7 days genuinely re-orders the board.
      # -------------------------------------------------------------------
      - id: leaderboard
        swap: /fragments/leaderboard
        heading:
          eyebrowTermId: lb.eyebrow
          titleTermId: lb.title
          level: 2
          class: serif
        # Beside the title rather than under the filters: how much of the scope
        # is showing, and the rule that decided the order. Both qualify the
        # board, and reading them after the controls that produced them states
        # the answer before the question.
        aside:
          - type: result-count
            bind: { source: services.filtered }
            options:
              termId: lb.showing
          - type: disclosure
            options:
              summaryTermId: lb.rankRuleTitle
              bodyTermId: lb.rankRule
              class: popover
        widgets:
          - type: filter-bar
            options:
              searchTermId: flt.searchLabel
              searchPlaceholderTermId: flt.searchPlaceholder
              resultTermId: flt.results
              showRegions: true

          - type: leaderboard-table
            bind: { source: services.filtered }
            options:
              # Add a metric to domain.yaml and name it here to gain a column.
              # Anything that is not rank, name or status must be a metric id
              # the deployment actually declares.
              columns: [rank, name, status, metric.downtime, metric.errorRate]
              # Shown above the table, not only announced. A leaderboard is
              # ambiguous about which end is good, and this is where it says.
              captionTermId: lb.caption.issuer
              emptyTermId: flt.empty
              mobileCards: true

# -----------------------------------------------------------------------------
# THE DRAWER
#
# One service in depth. The first tab is what opens when no tab is named.
# -----------------------------------------------------------------------------
drawer:
  tabs:
    - id: overview
      titleTermId: dr.tab.overview
      grid: { minColWidth: 150px, gap: 12px }
      widgets:
        # What a requestor is, rather than how it is doing: what it calls, how
        # it subscribes, and whose failures its error rate is counting. Renders
        # as nothing for an issuer, which requests nothing.
        - type: requestor-detail
          span: true
          bind: { source: service.demand }
          options:
            callsTermId: req.callsLabel
            subscriptionTermId: req.subscription
            ownErrorsTermId: req.ownErrors
            ownDenomTermId: req.ownErrorsDenom
            publisherTermId: req.publisherErrors
            titleTermId: req.vsErrorRateTitle
            explainTermId: req.vsErrorRate
            ruleTermId: req.ownErrorsRule

        # The label above the tiles rather than a caption under them: a reader
        # scanning down the panel needs to know what the four numbers are
        # before reading them.
        - type: heading
          span: true
          options:
            termId: dr.metrics
            level: 3
            class: eyebrow

        # One tile per metric the deployment shows here, so adding a metric to
        # domain.yaml adds a tile without touching this file.
        - type: stat-tile
          repeatOver: config.metrics.drawer
          bind: { source: service.metric }

        - type: heading
          span: true
          options:
            termId: dr.spark
            level: 3
            class: eyebrow

        # Downtime, not availability: the drawer then speaks the same
        # vocabulary as the board that led the reader here, and higher on the
        # chart means worse on both.
        - type: sparkline
          span: true
          bind:
            source: service.history
            field: downtime
            # Fixed at the full history regardless of the period control: this
            # is the long view the tiles above do not give, and a trace that
            # shrank to a week when the reader narrowed the board would answer
            # the same question twice instead.
            days: 90
          options:
            summaryTermId: dr.spark.summary
            # The same phrase as a tile's target note, and the same term, so the
            # chart and the number beside it can never word it differently.
            targetTermId: metric.target

    # THE DEMAND SIDE OF ONE SERVICE.
    #
    # Who pulls this document, and how that compares with everything like it.
    # The peer block is the backbone rather than a footnote: most APIs have one
    # requestor or none, so a mix of callers has nothing to say about them,
    # while every service — including one nobody has onboarded against — can be
    # read against its own category's median and best.
    - id: opportunity
      titleTermId: dr.tab.opportunity
      grid: { gap: 20px }
      widgets:
        - type: demand-mix
          bind: { source: service.demand }
          options:
            days: 30
            requestorsTermId: dr.opp.requestors
            growthTermId: dr.opp.growth
            bySectorTermId: dr.opp.bySector
            byRequestorTermId: dr.opp.byNamedRequestor
            byPublisherTermId: dr.opp.byRequestor
            sectorColTermId: dr.opp.sector
            requestorColTermId: dr.opp.requestorCol
            countColTermId: dr.opp.pulls
            shareColTermId: dr.opp.share
            tableTermId: dr.datatable
            truncatedTermId: dr.opp.truncated
            issuerTermId: dr.opp.summary.issuer
            requestorTermId: dr.opp.summary.requestor
            noneTermId: dr.opp.summary.none

        - type: peer-bars
          bind: { source: service.peers }
          options:
            titleTermId: dr.opp.peers
            issuanceTermId: dr.opp.peerIssuance
            requestorsTermId: dr.opp.peerRequestors
            thisTermId: dr.opp.thisOne
            medianTermId: dr.opp.median
            bestTermId: dr.opp.best
            ruleTermId: dr.opp.peerRule
            noPeersTermId: dr.opp.noPeers

    - id: errors
      titleTermId: dr.tab.errors
      widgets:
        - type: bar-list
          bind: { source: service.errorBreakdown }
          options: { limit: 7 }

        # Every chart has a table behind it. A line on a screen is not
        # accessible to a screen reader, not copyable, and not checkable.
        - type: data-table
          bind: { source: service.errorBreakdown }
          options:
            summaryTermId: dr.err.table

    - id: traffic
      titleTermId: dr.tab.traffic
      widgets:
        - type: bar-chart
          bind:
            source: service.history
            field: volume
            overlay: errorRate
            # Fixed at thirty days regardless of the period control: daily bars
            # over ninety days are unreadable at this width.
            days: 30
          options:
            peakTermId: dr.traffic.peak
            lowTermId: dr.traffic.trough
            overlayTermId: metric.errorRate

        - type: data-table
          bind: { source: service.history, days: 30 }
          options:
            summaryTermId: dr.traffic.table
            every: 5

    - id: incidents
      titleTermId: dr.tab.incidents
      widgets:
        - type: timeline
          bind: { source: service.incidents }
          options:
            emptyTermId: dr.incidents.empty
            emptyIconKey: ui.check
            ongoingTermId: dr.incidents.ongoing
