# yaml-language-server: $schema=../../schema/locale.schema.json
#
# Russian — Русский.
#
# Every term falls back to en.yaml key by key, so this file needs to carry
# only what differs. Anything absent renders in English rather than as a raw
# term id, which is what makes a partial translation genuinely useful.
#
# Translated here: 175 of 299 terms — the entire interface.
# Left in English: 124 names of Indian services, providers and
# states. Those are proper nouns, and they belong to the *example* domain
# config that a deployment replaces wholesale — translating "Aadhaar" or
# "Maharashtra" here would be inventing a rendering nobody asked for, and
# would be thrown away by the first real deployment anyway.
#
# Numbers, dates and plural categories are not configured here. They come
# from CLDR via the locale code above, which knows more cases than a config
# block would: grouping, digit shapes and which plural forms this language
# actually has.
#
# Russian has four plural categories, and all four are reachable from
# the counts this dashboard shows.

locale: ru
name: Русский
direction: ltr

date:
  short: "2 Jan"
  full: "2 Jan 2006, 15:04"

terms:

  # --- Terms the Go implementation introduced that the original prototype did
  # not have: the accessible table behind each chart, and a few control labels.
  chrome.apply:     "Применить"
  dr.why:           "Почему такой статус:"
  dr.day:           "День"
  dr.err.code:      "Код"
  dr.err.meaning:   "Что это значит"
  dr.err.count:     "Запросы"
  dr.err.share:     "Доля"
  dr.err.table:     "Показать эти данные таблицей"
  dr.traffic.table: "Показать эти данные таблицей"
  dr.spark.summary: "Доступность за последние {days} дн., от {min} до {max}."
  verdict.barLabel: "Доля услуг в каждом состоянии"
  lb.col.name:      "Услуга"
  lb.rank.up:       "выше на {n}"
  lb.rank.down:     "ниже на {n}"
  lb.rank.same:     "позиция не изменилась"
  metric.trend:     "{delta} ({days} дн.)"

  # --- How long ago, and for how long. Written as plurals so that CLDR picks
  # the form; a translator writes only the arms their language uses.
  time.ago.second: "{n, plural, =0{только что} one{# секунду назад} few{# секунды назад} many{# секунд назад} other{# секунды назад}}"
  time.ago.minute: "{n, plural, one{# минуту назад} few{# минуты назад} many{# минут назад} other{# минуты назад}}"
  time.ago.hour:   "{n, plural, one{# час назад} few{# часа назад} many{# часов назад} other{# часа назад}}"
  time.ago.day:    "{n, plural, one{# день назад} few{# дня назад} many{# дней назад} other{# дня назад}}"
  time.for.second: "{n, plural, one{# секунда} few{# секунды} many{# секунд} other{# секунды}}"
  time.for.minute: "{n, plural, one{# минута} few{# минуты} many{# минут} other{# минуты}}"
  time.for.hour:   "{n, plural, one{# час} few{# часа} many{# часов} other{# часа}}"
  time.for.day:    "{n, plural, one{# день} few{# дня} many{# дней} other{# дня}}"

