# yaml-language-server: $schema=../../schema/locale.schema.json
#
# French — Français.
#
# Every term falls back to en.yaml key by key, so this file needs to carry
# only what differs. Anything absent renders in English rather than as a raw
# term id, which is what makes a partial translation genuinely useful.
#
# Translated here: 175 of 299 terms — the entire interface.
# Left in English: 124 names of Indian services, providers and
# states. Those are proper nouns, and they belong to the *example* domain
# config that a deployment replaces wholesale — translating "Aadhaar" or
# "Maharashtra" here would be inventing a rendering nobody asked for, and
# would be thrown away by the first real deployment anyway.
#
# Numbers, dates and plural categories are not configured here. They come
# from CLDR via the locale code above, which knows more cases than a config
# block would: grouping, digit shapes and which plural forms this language
# actually has.

locale: fr
name: Français
direction: ltr

date:
  short: "2 Jan"
  full: "2 Jan 2006, 15:04"

terms:

  # --- Terms the Go implementation introduced that the original prototype did
  # not have: the accessible table behind each chart, and a few control labels.
  chrome.apply:     "Appliquer"
  dr.why:           "Pourquoi cet état :"
  dr.day:           "Jour"
  dr.err.code:      "Code"
  dr.err.meaning:   "Signification"
  dr.err.count:     "Requêtes"
  dr.err.share:     "Part"
  dr.err.table:     "Afficher ces chiffres sous forme de tableau"
  dr.traffic.table: "Afficher ces chiffres sous forme de tableau"
  dr.spark.summary: "Disponibilité sur les {days} derniers jours, entre {min} et {max}."
  verdict.barLabel: "Part des services dans chaque état"
  lb.col.name:      "Service"
  lb.rank.up:       "gagne {n}"
  lb.rank.down:     "perd {n}"
  lb.rank.same:     "rang inchangé"
  metric.trend:     "{delta} ({days} j)"

  # --- How long ago, and for how long. Written as plurals so that CLDR picks
  # the form; a translator writes only the arms their language uses.
  time.ago.second: "{n, plural, =0{à l'instant} one{il y a # seconde} other{il y a # secondes}}"
  time.ago.minute: "{n, plural, one{il y a # minute} other{il y a # minutes}}"
  time.ago.hour:   "{n, plural, one{il y a # heure} other{il y a # heures}}"
  time.ago.day:    "{n, plural, one{il y a # jour} other{il y a # jours}}"
  time.for.second: "{n, plural, one{# seconde} other{# secondes}}"
  time.for.minute: "{n, plural, one{# minute} other{# minutes}}"
  time.for.hour:   "{n, plural, one{# heure} other{# heures}}"
  time.for.day:    "{n, plural, one{# jour} other{# jours}}"

