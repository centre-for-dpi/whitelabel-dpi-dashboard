# yaml-language-server: $schema=../../schema/locale.schema.json
#
# Spanish — Español.
#
# Every term falls back to en.yaml key by key, so this file needs to carry
# only what differs. Anything absent renders in English rather than as a raw
# term id, which is what makes a partial translation genuinely useful.
#
# Translated here: 175 of 299 terms — the entire interface.
# Left in English: 124 names of Indian services, providers and
# states. Those are proper nouns, and they belong to the *example* domain
# config that a deployment replaces wholesale — translating "Aadhaar" or
# "Maharashtra" here would be inventing a rendering nobody asked for, and
# would be thrown away by the first real deployment anyway.
#
# Numbers, dates and plural categories are not configured here. They come
# from CLDR via the locale code above, which knows more cases than a config
# block would: grouping, digit shapes and which plural forms this language
# actually has.

locale: es
name: Español
direction: ltr

date:
  short: "2 ene"
  full: "2 ene 2006, 15:04"

