  # --- The published rules. Each receives the live threshold values, so the sentence on screen always quotes the numbers actually in force.
  rule.maintenance: "قيد الصيانة = نافذة صيانة مخطط لها نشطة الآن."
  rule.major:       "انقطاع كبير = التوافر أقل من {majorAvail}٪ أو معدل الأخطاء أعلى من {majorErr}٪."
  rule.operational: "يعمل = التوافر {partialAvail}٪ فأكثر ومعدل الأخطاء {partialErr}٪ فأقل."
  rule.partial:     "انقطاع جزئي = التوافر أقل من {partialAvail}٪ أو معدل الأخطاء أعلى من {partialErr}٪."
  rule.unknown:     "غير معروف = لا قراءة، أو البيانات أقدم من {staleMinutes} دقيقة."

