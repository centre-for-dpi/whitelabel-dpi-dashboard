# yaml-language-server: $schema=../../schema/locale.schema.json
#
# Arabic — العربية.
#
# Every term falls back to en.yaml key by key, so this file needs to carry
# only what differs. Anything absent renders in English rather than as a raw
# term id, which is what makes a partial translation genuinely useful.
#
# Translated here: 175 of 299 terms — the entire interface.
# Left in English: 124 names of Indian services, providers and
# states. Those are proper nouns, and they belong to the *example* domain
# config that a deployment replaces wholesale — translating "Aadhaar" or
# "Maharashtra" here would be inventing a rendering nobody asked for, and
# would be thrown away by the first real deployment anyway.
#
# Numbers, dates and plural categories are not configured here. They come
# from CLDR via the locale code above, which knows more cases than a config
# block would: grouping, digit shapes and which plural forms this language
# actually has.
#
# The only right-to-left locale shipped. `direction: rtl` is what puts
# dir="rtl" on the document; the stylesheet uses logical properties
# throughout, so nothing else has to change.

locale: ar
name: العربية
direction: rtl

date:
  short: "2 Jan"
  full: "2 Jan 2006, 15:04"

terms:

  # --- Terms the Go implementation introduced that the original prototype did
  # not have: the accessible table behind each chart, and a few control labels.
  chrome.apply:     "تطبيق"
  dr.why:           "سبب هذه الحالة:"
  dr.day:           "اليوم"
  dr.err.code:      "الرمز"
  dr.err.meaning:   "معناه"
  dr.err.count:     "الطلبات"
  dr.err.share:     "النسبة"
  dr.err.table:     "عرض هذه الأرقام كجدول"
  dr.traffic.table: "عرض هذه الأرقام كجدول"
  dr.spark.summary: "التوفر خلال آخر {days} يومًا، بين {min} و{max}."
  verdict.barLabel: "نسبة الخدمات في كل حالة"
  lb.col.name:      "الخدمة"
  lb.rank.up:       "صعود {n}"
  lb.rank.down:     "هبوط {n}"
  lb.rank.same:     "لا تغيّر في الترتيب"
  metric.trend:     "{delta} ({days} ي)"

  # --- How long ago, and for how long. Written as plurals so that CLDR picks
  # the form; a translator writes only the arms their language uses.
  time.ago.second: "{n, plural, =0{الآن} zero{قبل # ثانية} one{قبل ثانية واحدة} two{قبل ثانيتين} few{قبل # ثوانٍ} many{قبل # ثانية} other{قبل # ثانية}}"
  time.ago.minute: "{n, plural, zero{قبل # دقيقة} one{قبل دقيقة واحدة} two{قبل دقيقتين} few{قبل # دقائق} many{قبل # دقيقة} other{قبل # دقيقة}}"
  time.ago.hour:   "{n, plural, zero{قبل # ساعة} one{قبل ساعة واحدة} two{قبل ساعتين} few{قبل # ساعات} many{قبل # ساعة} other{قبل # ساعة}}"
  time.ago.day:    "{n, plural, zero{قبل # يوم} one{قبل يوم واحد} two{قبل يومين} few{قبل # أيام} many{قبل # يومًا} other{قبل # يوم}}"
  time.for.second: "{n, plural, zero{# ثانية} one{ثانية واحدة} two{ثانيتان} few{# ثوانٍ} many{# ثانية} other{# ثانية}}"
  time.for.minute: "{n, plural, zero{# دقيقة} one{دقيقة واحدة} two{دقيقتان} few{# دقائق} many{# دقيقة} other{# دقيقة}}"
  time.for.hour:   "{n, plural, zero{# ساعة} one{ساعة واحدة} two{ساعتان} few{# ساعات} many{# ساعة} other{# ساعة}}"
  time.for.day:    "{n, plural, zero{# يوم} one{يوم واحد} two{يومان} few{# أيام} many{# يومًا} other{# يوم}}"

