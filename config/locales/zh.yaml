  # --- The published rules. Each receives the live threshold values, so the sentence on screen always quotes the numbers actually in force.
  rule.maintenance: "维护中 = 当前正处于计划维护窗口。"
  rule.major:       "严重中断 = 可用率低于 {majorAvail}% 或错误率高于 {majorErr}%。"
  rule.operational: "正常 = 可用率不低于 {partialAvail}% 且错误率不高于 {partialErr}%。"
  rule.partial:     "部分中断 = 可用率低于 {partialAvail}% 或错误率高于 {partialErr}%。"
  rule.unknown:     "未知 = 无读数，或数据超过 {staleMinutes} 分钟未更新。"

  # --- Findings, and the rule each one applied.
