# yaml-language-server: $schema=../../schema/locale.schema.json
#
# Chinese (Simplified) — 中文.
#
# Every term falls back to en.yaml key by key, so this file needs to carry
# only what differs. Anything absent renders in English rather than as a raw
# term id, which is what makes a partial translation genuinely useful.
#
# Translated here: 175 of 299 terms — the entire interface.
# Left in English: 124 names of Indian services, providers and
# states. Those are proper nouns, and they belong to the *example* domain
# config that a deployment replaces wholesale — translating "Aadhaar" or
# "Maharashtra" here would be inventing a rendering nobody asked for, and
# would be thrown away by the first real deployment anyway.
#
# Numbers, dates and plural categories are not configured here. They come
# from CLDR via the locale code above, which knows more cases than a config
# block would: grouping, digit shapes and which plural forms this language
# actually has.
#
# Chinese has a single plural category, so every plural term here has
# one arm. That is correct, not lazy.

locale: zh
name: 中文
direction: ltr

date:
  short: "1月2日"
  full: "2006年1月2日 15:04"

terms:

  # --- Terms the Go implementation introduced that the original prototype did
  # not have: the accessible table behind each chart, and a few control labels.
  chrome.apply:     "应用"
  dr.why:           "判定依据："
  dr.day:           "日期"
  dr.err.code:      "代码"
  dr.err.meaning:   "含义"
  dr.err.count:     "请求数"
  dr.err.share:     "占比"
  dr.err.table:     "以表格显示这些数据"
  dr.traffic.table: "以表格显示这些数据"
  dr.spark.summary: "最近 {days} 天的可用率，介于 {min} 与 {max} 之间。"
  verdict.barLabel: "各状态服务占比"
  lb.col.name:      "服务"
  lb.rank.up:       "上升 {n}"
  lb.rank.down:     "下降 {n}"
  lb.rank.same:     "排名未变"
  metric.trend:     "{delta}（{days} 天）"

  # --- How long ago, and for how long. Written as plurals so that CLDR picks
  # the form; a translator writes only the arms their language uses.
  time.ago.second: "{n, plural, =0{刚刚} other{# 秒前}}"
  time.ago.minute: "{n, plural, other{# 分钟前}}"
  time.ago.hour:   "{n, plural, other{# 小时前}}"
  time.ago.day:    "{n, plural, other{# 天前}}"
  time.for.second: "{n, plural, other{# 秒}}"
  time.for.minute: "{n, plural, other{# 分钟}}"
  time.for.hour:   "{n, plural, other{# 小时}}"
  time.for.day:    "{n, plural, other{# 天}}"

  # --- The dashboard's own name and strapline.
  brand.tagline:  "用通俗语言呈现公共服务运行状况"
  brand.wordmark: "服务状态"

  # --- The header: scope, period, language and theme controls.
  chrome.locale.label:   "语言"
  chrome.period.label:   "周期"
  chrome.scope.label:    "范围"
  chrome.scope.national: "全国"
  chrome.scope.state:    "地方（次国家级）"
  chrome.skip:           "跳到主内容"
  chrome.theme.label:    "主题"
  period.24h:            "24 小时"
  period.30d:            "30 天"
  period.7d:             "7 天"
  period.90d:            "90 天"
  theme.dark:            "深色"
  theme.light:           "浅色"

