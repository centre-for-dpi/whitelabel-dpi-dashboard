# yaml-language-server: $schema=../../schema/locale.schema.json
#
# English — the base locale.
#
# Every other locale falls back to this one key by key, so a partial translation
# is genuinely useful: whatever is translated appears translated, and the rest
# appears in English rather than as a raw term id.
#
# A term id with no entry anywhere renders as itself. That is deliberate: a
# deployment that does not translate can put literal text in its config files
# and it will simply work.
#
# Braces are ICU message syntax. {count, plural, one{# service} other{# services}}
# picks a form by number and substitutes it for #. Which forms a language needs
# is decided by CLDR, not by this file — Arabic has six, Russian four, English
# two — so translators write only the ones their language uses.

locale: en
name: English
direction: ltr

# There is no number format here, and no plural rule.
#
# Both come from CLDR via the locale code above, which is right about more cases
# than a config block would be: Hindi groups as 29,00,000 rather than 2,900,000,
# Arabic renders ٢٬٩٠٠٬٠٠٠ with the percent sign on the correct side, French and
# Russian group with a narrow no-break space, and each language gets exactly the
# plural categories it has.
#
# `pluralRule` does exist as an escape hatch, for a locale whose tag CLDR has no
# rules for — a private-use tag, or a language x/text does not yet cover. Without
# it such a locale gets "other" for every count, which reads as "1 services".
# Setting it here would be redundant: English's plural rule is English's.

