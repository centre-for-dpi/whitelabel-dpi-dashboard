  # --- The published rules. Each receives the live threshold values, so the sentence on screen always quotes the numbers actually in force.
  rule.maintenance: "Matengenezo = dirisha la matengenezo lililopangwa liko hai sasa."
  rule.major:       "Hitilafu kubwa = upatikanaji chini ya {majorAvail}% au kiwango cha makosa juu ya {majorErr}%."
  rule.operational: "Inafanya kazi = upatikanaji {partialAvail}% au zaidi na makosa {partialErr}% au chini."
  rule.partial:     "Hitilafu ya sehemu = upatikanaji chini ya {partialAvail}% au makosa juu ya {partialErr}%."
  rule.unknown:     "Haijulikani = hakuna usomaji, au data kongwe zaidi ya dakika {staleMinutes}."

  # --- Findings, and the rule each one applied.
  sig.belowTarget.rule:      "Kanuni: upatikanaji chini ya lengo kila siku ya siku {days} zilizopita."
