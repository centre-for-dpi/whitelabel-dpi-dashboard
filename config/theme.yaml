# yaml-language-server: $schema=../schema/theme.schema.json
#
# Design tokens only. This file declares values; it adds no selectors, so
# nothing here can restructure the page.
#
# The server turns these into a single generated stylesheet at /assets/theme.css
# with a stable ETag. Templates only ever reference var(--token) — no template
# contains a colour.
#
# Token values are written verbatim into that stylesheet, so any value
# containing { } ; < > /* */ or a newline is rejected at startup rather than
# being allowed to break out of the rule it lands in.

# Applied by default, and whenever the reader has explicitly chosen light.
light:
  --bg: "#FAF9F5"
  --card: "#FFFFFF"
  --fg: "#1A1917"
  --muted-fg: "#6B6862"
  --border-subtle: "#E6E3DC"
  # Every boundary that identifies a control, and the divider between bar
  # segments, is drawn in this colour, so WCAG 1.4.11 requires it to reach 3:1
  # against --bg, --card and all five --status-*-bg fills. Startup checks that.
  --border-strong: "#8A867E"
  --primary: "#1A1917"
  --primary-fg: "#FAF9F5"
  --accent: "#3D5A5B"
  --status-ok: "#1F6B4A"
  --status-ok-bg: "#E8F2EC"
  --status-partial: "#96601A"
  --status-partial-bg: "#FBF0DF"
  --status-major: "#A32A1E"
  --status-major-bg: "#FAE9E7"
  --status-unknown: "#6B6862"
  --status-unknown-bg: "#EFEDE8"
  --status-maintenance: "#2A4E86"
  --status-maintenance-bg: "#E8EFF9"

# Applied when the operating system asks for dark, unless the reader has chosen
# light, and always when the reader has chosen dark.
dark:
  --bg: "#16150F"
  --card: "#201F17"
  --fg: "#F3F1E9"
  --muted-fg: "#A8A395"
  --border-subtle: "#312F26"
  --border-strong: "#8C8871"
  --primary: "#F3F1E9"
  --primary-fg: "#16150F"
  --accent: "#8FB6B4"
  --status-ok: "#5BC48C"
  --status-ok-bg: "#152A20"
  --status-partial: "#E0A954"
  --status-partial-bg: "#2E2412"
  --status-major: "#EB7468"
  --status-major-bg: "#301715"
  --status-unknown: "#A8A395"
  --status-unknown-bg: "#26251C"
  --status-maintenance: "#7AA6E6"
  --status-maintenance-bg: "#141F30"

# Values that do not change between light and dark.
tokens:
  --radius-sm: 2px
  --radius-lg: 10px
  --radius-full: 999px
  --shadow-lg: 0 18px 40px -12px rgb(0 0 0 / 28%)
  --ease: cubic-bezier(0.22, 0.61, 0.36, 1)
  --dur: 260ms
  --measure: 1280px

# Self-hosted fonts are served from /assets/fonts/. Drop your own .woff2 files
# into that directory (or into <config-dir>/fonts/) and point `file` at them.
# Use `url` instead to load from somewhere else — but note that a strict
# Content-Security-Policy on your deployment may block it.
#
# Both families below are variable fonts, so one file covers a weight range and
# the `weight` values are ranges rather than single numbers. The subsets exist
# so a reader who only needs Latin does not download Cyrillic.
fonts:
  body:
    family: Outfit
    stack: Outfit, system-ui, -apple-system, sans-serif
    faces:
      - file: outfit-latin.woff2
        weight: 300 700
        style: normal
        display: swap
        unicodeRange: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD
      - file: outfit-latin-ext.woff2
        weight: 300 700
        style: normal
        display: swap
        unicodeRange: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF

  serif:
    family: Playfair Display
    stack: '"Playfair Display", "Noto Serif", Georgia, serif'
    faces:
      - file: playfair-latin.woff2
        weight: 400 600
        style: normal
        display: swap
        unicodeRange: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD
      - file: playfair-latin-ext.woff2
        weight: 400 600
        style: normal
        display: swap
        unicodeRange: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF
      - file: playfair-vietnamese.woff2
        weight: 400 600
        style: normal
        display: swap
        unicodeRange: U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB
      - file: playfair-cyrillic.woff2
        weight: 400 600
        style: normal
        display: swap
        unicodeRange: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116
      - file: playfair-italic-latin.woff2
        weight: 400 600
        style: italic
        display: swap
        unicodeRange: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD
      - file: playfair-italic-latin-ext.woff2
        weight: 400 600
        style: italic
        display: swap
        unicodeRange: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF
      - file: playfair-italic-vietnamese.woff2
        weight: 400 600
        style: italic
        display: swap
        unicodeRange: U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB
      - file: playfair-italic-cyrillic.woff2
        weight: 400 600
        style: italic
        display: swap
        unicodeRange: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116
