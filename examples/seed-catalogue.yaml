# The catalogue the demo data is generated from.
#
# This is EXAMPLE data, not part of the domain contract — which is why it lives
# under examples/ rather than config/. `make seed` turns it into
# examples/upstream/services.json, in exactly the shape the pull driver expects,
# and examples/push/payload.json, in exactly the shape the ingest API expects.
#
# The generator is seeded, so the same catalogue always produces the same
# dashboard. Screenshots stay stable, tests stay meaningful, and two people
# looking at the same demo see the same thing.
#
# Nothing here is required to run the dashboard against real data. It exists so
# that a fresh deploy renders something immediately, and so that a team wiring
# up their own API has a worked example of both wire formats to compare against.

# Roughly how many services should land in each state. The rest are operational.
#
# These shape the generated metrics; they do not assign the status directly. The
# generated numbers are run through the same threshold evaluator the dashboard
# uses at runtime, so the demo demonstrates the real rule rather than a
# decorative label.
mix:
  major: 10
  partial: 26
  maintenance: 5
  unknown: 5

# The same shape for the demand side, spread over its own list. Slightly
# healthier: a requestor that cannot reach an API stops calling it, so the
# chronic cases are thinner on the ground than they are among publishers.
requestorMix:
  major: 6
  partial: 16
  maintenance: 3
  unknown: 3

# Real services vary hugely in traffic, and a chart where every service looks
# equally busy teaches the reader nothing. Anything not listed gets a value
# derived from defaultTraffic.
