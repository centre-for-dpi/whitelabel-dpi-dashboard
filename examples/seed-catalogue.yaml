# THE DEMAND SIDE.
#
# A requestor is an organisation that calls a published API to complete a task
# for someone: a bank running KYC, a hospital pulling a health id, a lender
# checking a provident-fund record. It is the same exchange as the service
# above, seen from the other end, so it is generated as the same kind of record
# — availability, error rate, history, incidents — and ranked on the same rule.
#
# The distribution is deliberate and uneven, and that is the point. Hub APIs
# carry many requestors across several sectors; the long tail carries one or
# two; and a named handful of live APIs — CoWIN, DIKSHA, UMANG, the soil-health
# card and two state registers — carry NONE, because citizens reach them
# through DigiLocker and UMANG rather than through any subscribed organisation.
# Smoothing those zeroes away would delete the finding the Opportunities view
# exists to surface.
#
# `calls` is the `key` of the service being consumed, and must name one.
requestors:
  # Aadhaar: identity verification, the platform's busiest API
  - { key: bankKyc, sector: sec.banking, calls: aadhaar, category: cat.identity, subscription: document }
  - { key: telecomSim, sector: sec.telecom, calls: aadhaar, category: cat.identity, subscription: document }
  - { key: brokerKyc, sector: sec.fintech, calls: aadhaar, category: cat.identity, subscription: document }
